<!doctype html><meta charset="utf-8"><title>保险跟单仔 · 交互原型</title><style>*{box-sizing:border-box}body{margin:0;font:14px 'PingFang SC',sans-serif;color:#171717;background:#fafafa}aside{position:fixed;width:250px;height:100vh;background:white;border-right:1px solid #eee;padding:20px}button{cursor:pointer;border:1px solid #e5e5e5;background:white;border-radius:7px;padding:10px 15px;color:inherit}button:hover{background:#f1f1f1}.black{background:#171717;color:white}nav button{display:block;width:100%;text-align:left;border:0;margin:8px 0}main{margin-left:250px}header{background:white;padding:24px;border-bottom:1px solid #eee;font-size:20px;font-weight:600}section{padding:24px}.note{background:#fff8e6;padding:12px 20px;font-size:13px}.box{background:white;border:1px solid #eee;border-radius:9px;padding:20px;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{padding:15px;text-align:left;border-bottom:1px solid #eee}small{color:#888}input,select{padding:10px;border:1px solid #ddd;border-radius:6px;margin:8px}dialog{width:920px;border:1px solid #eee;border-radius:12px;padding:24px}dialog::backdrop{background:#0005}.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}h3{margin-top:0}.pill{background:#f5f5f5;padding:4px 9px;border-radius:20px}.steps{display:flex;gap:10px;flex-wrap:wrap}details{margin:15px 0}footer{text-align:right;margin-top:25px}</style><aside><h3>▣　保险跟单仔</h3><small>　　客户管理系统</small><p><button class="black" style="width:100%" onclick="upload()">⊕ 添加 / 导入</button></p><small>工作台</small><nav><button onclick="page('contacts')">♙ 全部联系人</button><button onclick="page('board')">▤ 跟进工作台</button><button onclick="page('policies')">▧ 保单管理</button><button onclick="page('renew')">◷ 续费待办 <small>新增</small></button><button onclick="page('map')">查看本次改动与操作路线</button></nav><small>标签筛选</small><p>□ 储蓄险</p><p>□ 养老金</p><p>□ 医疗险</p><p>□ 成交客户</p><p>□ 重疾险</p></aside><main><div class="note">交互原型 · 沿用正式版黑白布局 · 示例数据 · 操作仅在此页面演示，不写入线上、不发送邮件</div><header id="title"></header><section id="content"></section></main><dialog id="modal"></dialog><script>
const $=id=>document.getElementById(id);let paid=false,contacted=false;const b=(t,fn)=>`<button onclick="${fn}">${t}</button>`;function show(s){$('modal').innerHTML=s+`<footer>${b('关闭','$(\'modal\').close()')}</footer>`;if(!$('modal').open)$('modal').showModal()}
function page(p){const titles={map:'本次改动 · 页面与交互',board:'跟进工作台',contacts:'全部联系人',policies:'保单管理',renew:'续费待办',settings:'提醒设置'};$('title').textContent=titles[p];if(p==='renew')$('title').innerHTML+=' <button style="float:right;font-size:14px" onclick="settings()">⚙ 提醒设置</button>';let s='';if(p==='map')s=`<h3>在现有页面内扩展，增加两个入口</h3><table><tr><th>页面</th><th>本次变化</th><th>体验</th></tr>${[['添加 / 导入','新增明亚三表上传 → 预览 → 核对 → 导入','upload()'],['联系人编辑弹窗','投保 / 被保角色切换，展示关联的所有保单','customer()'],['保单管理','按保单查看关联客户及缴费历史',"page('policies')"],['续费待办（新增）','最新一期应缴 → 联系标记 → 确认缴费',"page('renew')"],['续费待办右上角 · 提醒设置','弹窗设置邮箱、每日时间并预览摘要',"page('renew');settings()"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${b('查看',r[2])}</td></tr>`).join('')}</table>`;
if(p==='board')s=`<small>保留现有栏目布局；本原型只演示此次新增流程。</small><div class="cols">${['待联系','跟进中'].map(t=>`<div class="box"><h3>${t}</h3>${b('陈女士 · 查看客户','customer()')}</div>`).join('')}</div>`;
if(p==='contacts')s=`<input placeholder="搜索联系人"><div class="box">陈女士　<span class="pill">成交客户</span>　${b('编辑资料 / 查看保单','customer()')}</div>`;
if(p==='policies')s=`${b('导入明亚表格','upload()')}<div class="box"><h3>客户关联保单</h3><table><tr><th>产品</th><th>投保人</th><th>被保人</th><th>操作</th></tr><tr><td>示例长期医疗险</td><td>${b('陈女士','customer()')}</td><td>林小朋友</td><td>${b('保单详情','detail()')}</td></tr></table></div>`;
if(p==='renew')s=`<div class="steps">${b('全部',"page('renew')")}${b('本期应缴',"page('renew')")}${b('到期续保','renewal()')}${b('邮件摘要预览','mail()')}</div><div class="box"><h3>未来 30 天 · ${paid?0:1} 笔待缴</h3><small>每份保单仅显示最新一期需缴记录，历史期次在详情查看。已完成项可在下方查看。</small><table><tr><th>投保人 / 被保人</th><th>保单</th><th>应缴日期</th><th>应缴金额</th><th>处理</th></tr>${paid?'':`<tr><td>陈女士 / 林小朋友</td><td>${b('示例长期医疗险','detail()')}<br><small>保单号 ****1001</small></td><td>2026-11-15</td><td>¥ 3,200</td><td>${b(contacted?'已联系':'标记已联系',"contacted=true;page('renew')")}${b('确认已缴费','confirmPaid()')}</td></tr>`}</table>${paid?`<details><summary>已完成（1）</summary>****1001 · 2026-11-15 期 · 已缴费 ${b('撤销标记',"paid=false;page('renew')")}</details>`:''}</div>`;
if(p==='settings')s=`<div class="box"><h3>每日邮件摘要</h3><p><label><input type="checkbox" checked>启用每日发送</label></p><p>收件邮箱 <input id="email" type="email" value="${sessionStorage.email||'your@example.com'}"></p><p>发送时间 <input id="time" type="time" value="${sessionStorage.time||'09:00'}"> 北京时间</p><p>内容：未来30天的续保和最新应缴、逾期待办；已完成项排除。</p>${b('保存设置',"sessionStorage.email=$('email').value;sessionStorage.time=$('time').value;show('<h3>设置已保存（原型演示）</h3>')")} ${b('预览邮件','mail()')}</div>`;
$('content').innerHTML=s}
function settings(){const previous=$('content').innerHTML;page('settings');const form=$('content').innerHTML;page('renew');show('<h3>提醒设置</h3>'+form)}
function upload(){show(`<h3>添加 / 导入</h3><div class="steps">手动添加　 Excel导入　 <b>明亚保单导入（新增）</b></div><div class="box">选择推广业务、经代业务、应缴明细，支持一起上传。<p><input type="file" multiple accept=".xlsx"></p><small>原型不解析文件，使用示例批次展示完整流程。</small></div>${b('使用示例进入预览','preview()')}`)}
function preview(){show(`<h3>导入预览 · 确认后才写入</h3><div class="box">新增保单 2　更新 1　撤单/退保过滤 1　客户待核对 1</div><p>姓名、手机尾号、证件尾号一致时关联已有客户；信息不足时需核对。</p><table><tr><td>陈女士</td><td>手机尾号1234 / 证件尾号5678</td><td>匹配已有客户</td></tr><tr><td>林小朋友</td><td>只有姓名</td><td>${b('核对关联','resolve()')}</td></tr></table><p>最新表格将覆盖对应期次缴费状态；示例：一笔人工“已缴费”将更新为“未缴费”。</p>${b('确认导入示例',"show('<h3>导入完成（演示）</h3><p>保单已关联客户，应缴已按期次更新。</p>'+b('查看续费待办',\"$('modal').close();page('renew')\"))")}`)}
function resolve(){show(`<h3>核对被保人</h3><p>林小朋友：仅有姓名，不能使用投保人的手机号或证件号代替核对。</p><select><option>关联已有客户：林小朋友</option><option>创建独立客户</option><option>暂不关联，保留待核对</option></select>${b('确认并返回预览','preview()')}`)}
function customer(){show(`<h3>编辑联系人资料</h3><div class="cols"><div>备注名 <input value="陈女士"><p>手机号 <input value="138****1234"></p><p>标签 <span class="pill">成交客户</span></p><h4>关联保单（此次扩展）</h4>${b('全部角色','roles(0)')} ${b('我投保的','roles(1)')} ${b('我是被保人','roles(2)')}<div id="roles" class="box">示例长期医疗险 · 投保人 ${b('详情','detail()')}<p>示例重疾险 · 被保人</p></div></div><div><h4>跟进状态　跟进中</h4><h4>跟进历史</h4><small>保留现有资料及跟进区域</small></div></div>`)}function roles(n){$('roles').innerHTML=(n===2?'示例重疾险 · 被保人':'示例长期医疗险 · 投保人')+' '+b('详情','detail()')}
function detail(){show(`<h3>保单详情 · ****1001</h3><p>示例长期医疗险　正式保单</p><p>投保人：陈女士　被保人：林小朋友</p><div class="box"><h4>最新一期应缴</h4>2026-11-15　¥3,200　${paid?'已缴费':'未缴费'} ${b('确认已缴费','confirmPaid()')}</div><details><summary>历史缴费记录（2期）</summary><p>2025-11-15 · 已缴费</p><p>2024-11-15 · 已缴费</p></details>`)}
function confirmPaid(){show(`<h3>确认本期已缴费</h3><p>****1001 · 2026-11-15 · ¥3,200</p><input type="date" value="2026-10-22"><input placeholder="备注（选填）"><p>仅标记这一期。下次导入以新表格状态为准，保留变更记录。</p>${b('确认',"paid=true;$('modal').close();page('renew')")}`)}
function renewal(){show(`<h3>到期续保</h3><p>示例医疗险 · 到期日 2026-11-20</p><small>到期日期须有明确来源；缺少期限的保单进入待补充，不从生效日期直接猜测。</small><p>${b('标记已续保',"show('<h3>已续保（演示）</h3><p>此保单的本次续保待办已完成，可在保单详情查看。</p>')")}</p>`)}
function mail(){show(`<h3>邮件预览 · 保险跟单仔每日提醒</h3><p>收件人：${sessionStorage.email||'your@example.com'}　每日 ${sessionStorage.time||'09:00'}</p><div class="box"><h4>2026年10月22日 · 续费待办摘要</h4><p>本期应缴：${paid?'暂无待办':'陈女士 / 林小朋友 · ****1001 · 11月15日 · ¥3,200'}</p><p>到期续保：示例医疗险 · 11月20日</p>${b('打开系统待办',"$('modal').close();page('renew')")}</div><small>原型仅预览，不发送邮件。正式邮件与系统使用相同筛选规则。</small>`)}page('map');
</script>
